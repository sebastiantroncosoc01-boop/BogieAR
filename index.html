<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visualizador AR de Bogie Ferroviario</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #172536;
      color: white;
      padding: 16px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 60vh;
      min-height: 350px;
      background: white;
      border-radius: 12px;
      position: relative; /* Necesario para ubicar el botón y el panel AR */
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .panel h2 {
      margin-top: 0;
      font-size: 1.3rem;
      color: #172536;
    }

    .panel p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .panel a {
      color: #1769aa;
      text-decoration: none;
      font-weight: bold;
    }

    .panel a:hover {
      text-decoration: underline;
    }

    /* --- ESTILOS DEL BOTÓN AR --- */
    #ar-button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    /* --- ESTILOS DEL PANEL DENTRO DE AR (Solo Android WebXR) --- */
    #ar-info-panel {
      display: none; /* Oculto por defecto */
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 320px;
      background: rgba(23, 37, 54, 0.9);
      color: white;
      padding: 16px;
      border-radius: 12px;
      pointer-events: none; /* Para que no bloquee los toques en la pantalla */
    }

    #ar-info-panel h3 { margin: 0 0 8px; font-size: 16px; }
    #ar-info-panel p { margin: 4px 0; font-size: 14px; line-height: 1.4; }
    #ar-info-panel a { color: #64b5f6; text-decoration: none; font-weight: bold; pointer-events: auto; }

    /* Mostrar panel y ocultar botón cuando AR esté activo */
    model-viewer.is-in-ar #ar-info-panel {
      display: block;
    }

    model-viewer.is-in-ar #ar-button {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h2>Visualizador AR Bogie</h2>
</header>

<main>
  <h2>Bogie Cali</h2>

  <model-viewer
    id="bogie"
    src="Bogie.glb"
    alt="Modelo 3D del bogie"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    shadow-intensity="1"
    exposure="1">

    <!-- Botón para entrar a AR -->
    <button id="ar-button" slot="ar-button">
      Visualizar en mi espacio
    </button>

    <!-- Panel de información superpuesto en AR -->
    <div id="ar-info-panel">
      <h3>Bogie - Ferrocarril del Pacífico</h3>
      <p><strong>Créditos:</strong> Sebastian Troncoso y Juan Carlos Rengifo para Pacific+</p>
      <p><a href="https://www.pacificplus.co" target="_blank">www.pacificplus.co</a></p>
    </div>

  </model-viewer>

  <!-- Ficha de información en la página web -->
  <section class="panel">
    <h2>Bogie - Ferrocarril del Pacífico</h2>
    <p><strong>Créditos:</strong> Sebastian Troncoso y Juan Carlos Rengifo para Pacific+</p>
    <p><a href="https://www.pacificplus.co" target="_blank">www.pacificplus.co</a></p>
  </section>
</main>

<script>
  const modelViewer = document.getElementById('bogie');

  // Controla la visibilidad del panel de información cuando se entra y sale de AR
  modelViewer.addEventListener('ar-status', (event) => {
    if (event.detail.status === 'session-started') {
      modelViewer.classList.add('is-in-ar');
    } else if (event.detail.status === 'not-presenting') {
      modelViewer.classList.remove('is-in-ar');
    }
  });
</script>

</body>
</html>
