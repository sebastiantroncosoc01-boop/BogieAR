<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Visualizador AR de Bogie Ferroviario</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #172536;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .header-logo {
      height: 45px;
      width: auto;
      background-color: #f4f5f7;
      border-radius: 6px;
      padding: 4px 8px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 60vh;
      min-height: 350px;
      background: white;
      border-radius: 12px;
      position: relative;
    }

    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .panel h2 {
      margin-top: 0;
      font-size: 1.3rem;
      color: #172536;
    }

    .panel p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .panel a {
      color: #1769aa;
      text-decoration: none;
      font-weight: bold;
    }

    .panel a:hover {
      text-decoration: underline;
    }

    #ar-button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    /* --- PANEL DE TEXTO EN AR --- */
    #ar-info-panel {
      display: none;
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: 250px;
      background: rgba(23, 37, 54, 0.9);
      color: white;
      padding: 16px;
      border-radius: 12px;
      pointer-events: none;
    }

    #ar-info-panel h3 { margin: 0 0 8px; font-size: 16px; }
    #ar-info-panel p { margin: 4px 0; font-size: 14px; line-height: 1.4; }
    #ar-info-panel a { color: #64b5f6; text-decoration: none; font-weight: bold; pointer-events: auto; }

    /* --- MARCA DE AGUA EN AR --- */
    #ar-watermark {
      display: none;
      position: absolute;
      top: 16px;
      right: 16px;
      width: 120px;
      height: auto;
      opacity: 0.75;
      pointer-events: none;
      z-index: 10;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 6px;
      padding: 5px;
    }

    /* Reglas de visibilidad al entrar en AR */
    model-viewer.is-in-ar #ar-info-panel,
    model-viewer.is-in-ar #ar-watermark {
      display: block;
    }
    model-viewer.is-in-ar #ar-button {
      display: none;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 16px;
      }
      header h2 {
        font-size: 1.2rem;
      }
      .header-logo {
        height: 35px;
      }
      #ar-info-panel {
        max-width: 200px; 
      }
      #ar-watermark {
        width: 100px;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>Visualizador AR Bogie</h2>
  <img src="LogoPacific.jpeg" alt="Logo Pacific+ Vehicles" class="header-logo">
</header>

<main>
  <h2>Bogie Ferrocarril del Pacifico</h2>

  <model-viewer
    id="bogie"
    src="Bogie.glb"
    alt="Modelo 3D del bogie"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    shadow-intensity="1"
    exposure="1">

    <button id="ar-button" slot="ar-button">
      Visualizar en mi espacio
    </button>

    <!-- Panel de información izquierdo -->
    <div id="ar-info-panel">
      <h3>Bogie - Ferrocarril del Pacífico</h3>
      <p><strong>Créditos:</strong> Sebastian Troncoso y Juan Carlos Rengifo para Pacific+</p>
      <p><a href="https://www.pacificplus.co" target="_blank">www.pacificplus.co</a></p>
    </div>

    <!-- Marca de agua derecha -->
    <img id="ar-watermark" src="LogoPacific.jpeg" alt="Marca de agua Pacific+">

  </model-viewer>

  <section class="panel">
    <h2>Bogie - Ferrocarril del Pacífico</h2>
    <p><strong>Créditos:</strong> Sebastian Troncoso y Juan Carlos Rengifo para Pacific+</p>
    <p><a href="https://www.pacificplus.co" target="_blank">www.pacificplus.co</a></p>
  </section>
</main>

<script>
  const modelViewer = document.getElementById('bogie');

  modelViewer.addEventListener('ar-status', (event) => {
    if (event.detail.status === 'session-started') {
      modelViewer.classList.add('is-in-ar');
    } else if (event.detail.status === 'not-presenting') {
      modelViewer.classList.remove('is-in-ar');
    }
  });
</script>

</body>
</html>
